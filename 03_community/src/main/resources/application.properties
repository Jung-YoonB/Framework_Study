spring.application.name=03_community

# server port
server.port=8989

# ViewResolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# mybatis setting
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=C##SPRING
spring.datasource.password=SPRING

# mapper 파일 경로 지정 (resources/mappers 하위의 모든 xml 지정)
mybatis.mapper-locations=classpath:mappers/**/*.xml

# xml 에서 패키지 경로 없이 클래스명만 입력 할 수 있게 별칭 등록
mybatis.type-aliases-package=com.kh.community.member.model.dto, com.kh.community.board.model.dto

# null 값일때 null 로 저장
mybatis.configuration.jdbc-type-for-null=NULL

# 카멜 케이스 적용
mybatis.configuration.map-underscore-to-camel-case=true


# 파일 업로드 설정
# 업로드 파일 1개 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 업로드 요청의 최대 크기
spring.servlet.multipart.max-request-size=50MB

# 사용자 정의 설정
# 파일 경로
file.upload-dir=uploads
file.upload-dir.profile=uploads/profile
